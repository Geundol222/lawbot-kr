# Render Blueprint
# Docker 이미지로 배포

services:
  - type: web
    name: lawbot-kr-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # 또는 free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false  # Dashboard에서 수동 설정
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LAW_API_OC
        sync: false
      - key: LAW_API_SERVICE
        value: https://www.law.go.kr/DRF/lawService.do
      - key: LAW_API_SEARCH
        value: https://www.law.go.kr/DRF/lawSearch.do
    # 헬스 체크
    healthCheckPath: /health
