name: CD - Auto Deploy

# 라이브 데모 운영 중단으로 자동 배포를 끄고 수동 실행만 남김.
# Vercel(Frontend)은 Vercel 프로젝트의 Git 연동이 배포하므로 여기서는 하지 않음.
on:
  workflow_dispatch:  # 수동 실행

jobs:
  deploy-huggingface:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리 가져오기

    - name: Push to HuggingFace Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}  # 예: "username/lawbot-kr"
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

        # HuggingFace remote 추가 (이미 있으면 무시)
        git remote add hf https://huggingface.co/spaces/$HF_SPACE_NAME || true

        # HuggingFace에 푸시 (토큰 사용)
        git push https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME main --force

    - name: Comment on commit
      uses: peter-evans/commit-comment@v3
      with:
        body: |
          🚀 **Deployed to HuggingFace Spaces**

          View your app at: https://huggingface.co/spaces/${{ secrets.HF_SPACE_NAME }}

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-huggingface]
    if: always()

    steps:
    - name: Deployment Status
      run: |
        echo "🎉 Deployment workflow completed!"
        echo "HuggingFace Status: ${{ needs.deploy-huggingface.result }}"
