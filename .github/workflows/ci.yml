name: CI - Tests & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-cache-dir
        pip install pytest pytest-cov pytest-mock pytest-asyncio --no-cache-dir

    - name: Create .env.test file
      run: |
        echo "GOOGLE_API_KEY=test_key" >> .env.test
        echo "SUPABASE_URL=https://test.supabase.co" >> .env.test
        echo "SUPABASE_ANON_KEY=test_key" >> .env.test
        echo "LAW_API_OC=test_key" >> .env.test
        echo "WANDB_ENABLED=false" >> .env.test

    - name: Run unit tests
      run: |
        export PYTHONPATH="${PYTHONPATH}:${PWD}/backend"
        pytest tests/ -m unit -v --cov=backend/src --cov-report=xml --cov-report=term

    - name: Run integration tests (fast only)
      run: |
        export PYTHONPATH="${PYTHONPATH}:${PWD}/backend"
        pytest tests/ -m "integration and not slow" -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        # E501: 라인 길이 제한 (88자로 완화)
        # W503: 이항 연산자 앞 줄바꿈 허용
        flake8 backend/src --max-line-length=88 --extend-ignore=E501,W503
      continue-on-error: true

    - name: Run black (check only)
      run: |
        black backend/src --check --line-length=88
      continue-on-error: true

    - name: Run isort (check only)
      run: |
        isort backend/src --check-only --profile black
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy backend/src --ignore-missing-imports
      continue-on-error: true
